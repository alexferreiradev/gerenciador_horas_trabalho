name: CD - Deploy Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        node-version: [12]
        
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v4
      with:
        node-version: ${{matrix.node-version}}
    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v3
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: frontend-web/node_modules
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-build-${{ env.cache-name }}-${{ hashFiles('frontend-web/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-build-${{ env.cache-name }}-
    
    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: Install dependencies
      run: |
        cd frontend-web
        yarn install --immutable ${{ inputs.flags }}
      shell: bash
      
    - name: Build
      run: |
        cd frontend-web
        yarn build
    - uses: actions/upload-artifact@v4.3.1
      with:
        name: 'build-${{matrix.node-version}}'
        path: frontend-web/build

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs:
      - build
    
    steps:
      - uses: actions/download-artifact@v4.1.4
        with: 
          name: build-12
          path: _site
      - name: Display structure of downloaded files
        run: ls -R ./
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2